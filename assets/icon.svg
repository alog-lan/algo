<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="iconPrimaryGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052D4" />
      <stop offset="50%" stop-color="#4364F7" />
      <stop offset="100%" stop-color="#6FB1FC" />
    </linearGradient>
    
    <linearGradient id="iconAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <linearGradient id="iconNeonGreen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <linearGradient id="iconDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#161f30" />
    </linearGradient>

    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4364F7" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Orqa fon paneli -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#iconDarkBg)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />
  
  <!-- "A" harfi shaklidagi ramz -->
  <g transform="translate(43, 38)" filter="url(#iconShadow)">
    <!-- Asosiy "A" ramkasi -->
    <path d="M 85,15 L 145,160 L 110,160 L 80,75 L 50,160 L 15,160 Z" fill="url(#iconPrimaryGrad)" />
    
    <!-- Ichki o'tkir qanot -->
    <path d="M 85,15 L 130,125 L 95,125 L 78,70 Z" fill="url(#iconAccentGrad)" />

    <!-- O'rtadagi ko'prik (Algoritmik bog'lam) -->
    <polygon points="46,120 114,120 102,96 58,96" fill="url(#iconNeonGreen)" />
    
    <!-- Yuqori yadro (Compiler Core) -->
    <circle cx="85" cy="15" r="9" fill="#00F2FE" filter="url(#iconGlow)" />
  </g>
</svg>
