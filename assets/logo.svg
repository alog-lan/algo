<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Asosiy rang gradiyentlari -->
    <linearGradient id="primaryGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052D4" />
      <stop offset="50%" stop-color="#4364F7" />
      <stop offset="100%" stop-color="#6FB1FC" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <linearGradient id="neonGreen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#161f30" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0052D4" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    .brand-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 900;
      font-size: 88px;
      letter-spacing: -2px;
      fill: #FFFFFF;
    }
    .brand-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 600;
      font-size: 20px;
      letter-spacing: 6px;
      fill: #00F2FE;
      text-transform: uppercase;
    }
    .brand-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 14px;
      font-weight: 700;
      fill: #00E676;
    }
  </style>

  <!-- Orqa fon paneli (dumaloq burchakli zamonaviy karta) -->
  <rect x="10" y="10" width="780" height="220" rx="32" fill="url(#darkBg)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />
  
  <!-- Nozik to'r (Grid bezak) -->
  <g opacity="0.07" stroke="#FFFFFF" stroke-width="1">
    <line x1="10" y1="65" x2="790" y2="65" />
    <line x1="10" y1="120" x2="790" y2="120" />
    <line x1="10" y1="175" x2="790" y2="175" />
    <line x1="260" y1="10" x2="260" y2="230" />
    <line x1="520" y1="10" x2="520" y2="230" />
  </g>

  <!-- EMBLEMA: "A" shaklidagi dinamik super-belgi -->
  <g transform="translate(60, 35)" filter="url(#subtleShadow)">
    <!-- O'ng qanot (Neon Cyan & Blue) -->
    <path d="M 85,15 L 140,155 L 105,155 L 75,70 L 45,155 L 10,155 Z" fill="url(#primaryGrad)" />
    
    <!-- Ichki chaqmoqsimon qirra (Tezlik / bare-metal energiyasi) -->
    <path d="M 85,15 L 125,120 L 95,120 L 75,65 Z" fill="url(#accentGrad)" />

    <!-- O'rtadagi bog'lovchi dinamik xesh/kod kubogi -->
    <polygon points="45,115 105,115 95,90 55,90" fill="url(#neonGreen)" />
    
    <!-- Yuqori nuqta (Compiler Core) -->
    <circle cx="85" cy="15" r="7" fill="#00F2FE" filter="url(#glow)" />
    
    <!-- Registr / Syscall poydevori -->
    <rect x="25" y="160" width="100" height="4" rx="2" fill="url(#neonGreen)" opacity="0.8" />
  </g>

  <!-- MATN: Brending nomlanishi -->
  <g transform="translate(245, 122)">
    <text x="0" y="0" class="brand-title">ALGO</text>
    <text x="255" y="-38" class="brand-badge">v1.5.0 • x86_64</text>
    <text x="2" y="38" class="brand-subtitle">Tez • Mustaqil • O'zbekcha</text>
  </g>

  <!-- O'ng tarafdagi texnologik xususiyatlar ikonchalari -->
  <g transform="translate(670, 75)" opacity="0.85">
    <!-- Zero libc nishoni -->
    <rect x="0" y="0" width="85" height="28" rx="8" fill="#1f293d" stroke="#4FACFE" stroke-width="1" />
    <text x="42" y="18" fill="#4FACFE" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">ZERO-LIBC</text>

    <!-- Native ASM nishoni -->
    <rect x="0" y="38" width="85" height="28" rx="8" fill="#1f293d" stroke="#00E676" stroke-width="1" />
    <text x="42" y="56" fill="#00E676" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">BARE METAL</text>

    <!-- Async nishoni -->
    <rect x="0" y="76" width="85" height="28" rx="8" fill="#1f293d" stroke="#FF9100" stroke-width="1" />
    <text x="42" y="94" fill="#FF9100" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">x86_64 ASM</text>
  </g>
</svg>
