<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200">
  <!-- Algo Official Full Logo - 100% Transparent Background -->
  <!-- Hexagon 'A' Emblemasi (Chap tomonda, aniq va muhtasham) -->
  <g transform="translate(25, 20) scale(5)">
    <!-- Hexagon Frame -->
    <path fill="#0288d1" d="M16 2 3 9.5v13L16 30l13-7.5v-13ZM16 4.8 26.5 10.9v10.2L16 27.2 5.5 21.1V10.9Z"/>
    <!-- Bold 'A' -->
    <path fill="#00e5ff" d="M16 7 9 24h3.8l1.4-3.5h5.6l1.4 3.5H25ZM15 17.2 16 13l1 4.2Z"/>
  </g>

  <!-- MATN: "algo" (Kichik harflarda, zamonaviy Go/Rust/Node uslubida) -->
  <g transform="translate(225, 130)">
    <!-- Asosiy "algo" yozuvi -->
    <text x="0" y="0" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-weight="800" 
          font-size="112px" 
          letter-spacing="-3px" 
          fill="#0288d1">algo</text>
    
    <!-- Nuqta (Turkuaz til belgisi) -->
    <circle cx="246" cy="-90" r="11" fill="#00e5ff" />

    <!-- Tagyozuv: "DASTURLASH TILI • ZERO-LIBC" -->
    <text x="5" y="32" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-weight="600" 
          font-size="16px" 
          letter-spacing="4px" 
          fill="#10b981" 
          text-transform="uppercase">DASTURLASH TILI • ZERO-LIBC</text>
  </g>
</svg>