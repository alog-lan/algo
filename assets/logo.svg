<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="700" height="200">
  <!-- Algo Official Full Logo - 100% Transparent Background -->
  <defs>
    <linearGradient id="logo_blue" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="logo_cyan" x1="50%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="logo_emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- EMBLEMA (Chap tomonda, x=30, y=10, 180x180) -->
  <g transform="translate(30, 10) scale(0.703)">
    <!-- Chap qanot -->
    <path d="M 128,26 C 124,26 120,29 118,33 L 30,207 C 27,214 31,222 39,222 L 79,222 C 85,222 90,218 93,212 L 115,162 L 128,132 L 128,26 Z" 
          fill="url(#logo_blue)" />
    <!-- O'ng qanot -->
    <path d="M 128,26 L 128,132 L 141,162 L 163,212 C 166,218 171,222 177,222 L 217,222 C 225,222 229,214 226,207 L 138,33 C 136,29 132,26 128,26 Z" 
          fill="url(#logo_cyan)" />
    <!-- Ko'prik -->
    <path d="M 68,162 L 188,162 C 195,162 199,170 195,176 L 175,208 C 172,213 167,216 161,216 L 95,216 C 89,216 84,213 81,208 L 61,176 C 57,170 61,162 68,162 Z" 
          fill="url(#logo_emerald)" />
    <!-- Yadro -->
    <polygon points="128,82 108,132 148,132" fill="#FFFFFF" opacity="0.95" />
  </g>

  <!-- MATN: "algo" (Kichik harflarda, zamonaviy Go/Rust/Python uslubida) -->
  <g transform="translate(210, 130)">
    <!-- Asosiy "algo" yozuvi -->
    <text x="0" y="0" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-weight="800" 
          font-size="108px" 
          letter-spacing="-3px" 
          fill="#3B82F6">algo</text>
    
    <!-- Nuqta (Turkuaz til belgilari) -->
    <circle cx="236" cy="-86" r="11" fill="#00F2FE" />

    <!-- Tagyozuv: "Mustaqil • x86_64 Mashina Kodi" -->
    <text x="5" y="32" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-weight="600" 
          font-size="16px" 
          letter-spacing="4px" 
          fill="#10B981" 
          text-transform="uppercase">DASTURLASH TILI • ZERO-LIBC</text>
  </g>
</svg>
