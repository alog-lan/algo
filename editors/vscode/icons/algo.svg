<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Algo Dasturlash Tili - Rasmiy Belgisi (100% Shafof Fon, Bosh joylarsiz yirik SVG) -->
  <defs>
    <linearGradient id="algo_blue" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="algo_cyan" x1="50%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="algo_cross" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Chap qanot (Blue Pillar): Kuchli ko'k gradientli tayanch -->
  <path d="M 128,10 C 123,10 118,14 116,18 L 10,228 C 7,236 12,246 21,246 L 69,246 C 76,246 82,241 86,234 L 112,174 L 104,140 L 128,80 L 128,10 Z" 
        fill="url(#algo_blue)" />

  <!-- O'ng qanot (Cyan Pillar): Yorqin havorang gradientli tayanch -->
  <path d="M 128,10 L 128,80 L 152,140 L 144,174 L 170,234 C 174,241 180,246 187,246 L 235,246 C 244,246 249,236 246,228 L 140,18 C 138,14 133,10 128,10 Z" 
        fill="url(#algo_cyan)" />

  <!-- Markaziy algoritmik ko'prik (The Algorithmic Chevron Crossbar) -->
  <path d="M 56,174 L 200,174 C 208,174 213,184 208,191 L 184,230 C 180,236 174,240 167,240 L 89,240 C 82,240 76,236 72,230 L 48,191 C 43,184 48,174 56,174 Z" 
        fill="url(#algo_cross)" />
</svg>
